
name: Build Custom Rocket.Chat APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-node

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Error: GOOGLE_SERVICES_JSON is not configured."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          python3 -m json.tool android/app/google-services.json > /dev/null
    
      - name: Restore Android signing key
        shell: bash
        env:
          SIGNING_KEY_ENCRYPTED_BASE64: ${{ secrets.SIGNING_KEY_ENCRYPTED_BASE64 }}
          ENCRYPTION_PASSWORD: ${{ secrets.ENCRYPTION_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$SIGNING_KEY_ENCRYPTED_BASE64" ] || [ -z "$ENCRYPTION_PASSWORD" ]; then
            echo "Error: Signing key secrets are missing."
            exit 1
          fi

          printf '%s' "$SIGNING_KEY_ENCRYPTED_BASE64" | base64 --decode > "$RUNNER_TEMP/signing-key.enc"

          openssl enc -d -aes-256-cbc \
            -pbkdf2 \
            -iter 200000 \
            -in "$RUNNER_TEMP/signing-key.enc" \
            -out android/app/ygn-release.keystore \
            -pass env:ENCRYPTION_PASSWORD

          chmod 600 android/app/ygn-release.keystore
          rm -f "$RUNNER_TEMP/signing-key.enc"

      - name: Build release APK
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_KEYSTORE: ygn-release.keystore
          ORG_GRADLE_PROJECT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_KEY_ALIAS: ygnstamp
          ORG_GRADLE_PROJECT_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Remove temporary signing key
        if: always()
        run: |
          rm -f android/app/ygn-release.keystore
          rm -f "$RUNNER_TEMP/signing-key.enc"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: rocketchat-custom-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
