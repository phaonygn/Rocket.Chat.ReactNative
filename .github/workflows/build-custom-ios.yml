
name: Build Custom Rocket.Chat iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-ios-environment:
    name: Check iOS Build Environment
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-node

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.7.7'
          bundler-cache: true

      - name: Install CocoaPods dependencies
        run: |
          bundle exec pod install --project-directory=ios

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Check iOS project
        run: |
          xcodebuild -list \
            -project ios/RocketChat.xcodeproj

      - name: Check required files
        run: |
          test -f ios/Podfile
          test -f ios/RocketChat.xcodeproj/project.pbxproj
          test -f ios/RocketChat.xcodeproj/xcshareddata/xcschemes/RocketChat.xcscheme
          echo "iOS project files verified."

      - name: Show environment
        run: |
          ruby --version
          node --version
          git --version
          echo "Environment check completed."

      - name: Exclude Apple Watch from iOS build
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("ios/RocketChat.xcodeproj/project.pbxproj")
          content = path.read_text()

          lines_to_remove = [
              "1ED1ECE32B8699DD00F6620C /* Embed Watch Content */,",
              "1ED1ECE62B8699E900F6620C /* PBXTargetDependency */,",
          ]

          for line in lines_to_remove:
              if line not in content:
                  raise SystemExit(f"Expected setting not found: {line}")
              content = content.replace(line, "", 1)

          path.write_text(content)
          print("Apple Watch excluded from YGN iOS build.")
          PY

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -workspace ios/RocketChat.xcworkspace \
            -scheme RocketChat \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/YGNBuild" \
            CODE_SIGNING_ALLOWED=NO \
            build
